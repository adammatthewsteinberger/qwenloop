# vibey-gh owns provenance and release automation for this repository.

[fingerprint]
sources = [
  "src/**/*.py",
  "tests/**/*.py",
  "scripts/**/*.py",
  ".github/workflows/*.yml",
]

[version]
files         = ["pyproject.toml", "src/qwenloop/__init__.py"]
content_paths = ["src/qwenloop/"]
code_paths    = ["src/qwenloop/"]

[branches]
integration = "develop"
release     = "main"

[merge_train]
owner           = "adammatthewsteinberger"
trusted_authors = ["adammatthewsteinberger", "claude[bot]", "github-actions[bot]", "vibey[bot]"]

[install]
# Pin every rendered template to the exact version that rendered it. Without this the
# workflows run `pip install vibey-gh` unpinned, so a runner silently adopts whatever is
# newest -- which is how vibey-skills' CI jumped 1.2.0 -> 1.16.0 mid-week and went red on a
# `check` that had grown teeth. `vibey-gh install` is what advances the pin now.
pin_version = true
# Exactly the workflows this repository already has. Left unset, the default set would
# install several more; adopting those is a separate decision, not a version bump.
workflows = ["merge-train.yml", "promote-to-main.yml", "provenance.yml", "release-surfaces.yml"]

[documentation]
# Off deliberately. The contract is default-on and expects a marketplace manifest, a
# per-agent rules tree, a mermaid architecture diagram and a dozen other files. Satisfying
# it is a real project and a separate decision; adopting it silently as a side effect of a
# version bump would just make `check` fail on every push.
enabled = false

[pr_automation]
# The default set names "Docs". Nothing here answers to that name, and a gate that waits
# for a scan which can never complete never posts at all -- made a required check, that
# silently blocks every pull request.
scan_workflows = ["CI", "Provenance"]
